name: ESP32-P4 Firmware CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-P4 Binary
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile ESP32-P4 Firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . /opt/esp/idf/export.sh
          idf.py set-target esp32p4
          idf.py build
