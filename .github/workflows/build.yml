name: ESP32-P4 Firmware CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-P4 Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile ESP32-P4 Firmware via Docker
        shell: bash
        run: |
          docker run --rm -v ${{ github.workspace }}:/project -w /project espressif/idf:release-v5.3 \
            bash -c "git config --global --add safe.directory '*' && idf.py set-target esp32p4 && idf.py build"
